<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0f1a">
<title>Davinia</title>
<style>
:root{--bg:#0b0f1a;--card:#151b2b;--tx:#e8ecf5;--mut:#8b95ab;--bd:#232b40;--ac:#6ea8fe}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--tx);font:16px system-ui,sans-serif;padding:env(safe-area-inset-top) 10px calc(90px + env(safe-area-inset-bottom))}
header{display:flex;align-items:center;justify-content:space-between;padding:14px 4px 6px}
h1{font-size:26px;font-weight:700;letter-spacing:.5px}
.tabs{display:flex;gap:8px;margin:6px 0 10px}
.tabs button,.nav button,.b{background:var(--card);color:var(--tx);border:1px solid var(--bd);border-radius:12px;padding:10px 14px;font-size:15px}
.tabs button{flex:1}.tabs .on{background:var(--ac);color:#0b0f1a;font-weight:600}
.nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.nav b{text-transform:capitalize;font-size:19px}
#cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.w{text-align:center;color:var(--mut);font-size:13px;padding:2px 0}
.d{position:relative;aspect-ratio:1/1.35;border:1px solid var(--bd);border-radius:10px;background:var(--card);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:5px 0;font-size:14px}
.d span{font-weight:600}.d em{font-style:normal;font-size:22px}.d small{font-size:12px;font-weight:600}
.d.t{outline:2px solid #fff}.d u{position:absolute;top:2px;right:3px;font-size:11px;text-decoration:none}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px;margin-bottom:12px}
.card h3{font-size:16px;margin-bottom:8px}
.r{display:grid;grid-template-columns:1.3fr 1fr 1.4fr 1fr;gap:6px;align-items:center;margin-bottom:8px;font-size:14px}
input,select{background:#0b0f1a;color:var(--tx);border:1px solid var(--bd);border-radius:8px;padding:8px;font-size:15px;width:100%}
.f{display:grid;grid-template-columns:1fr 1fr;gap:8px}.f .full{grid-column:1/3}
.v{display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-top:1px solid var(--bd);font-size:14px}
.v button{background:none;border:0;color:#f87171;font-size:18px}
.m{color:var(--mut);font-size:13px}.tot{font-size:20px;font-weight:700}
#mic{position:fixed;right:18px;bottom:calc(20px + env(safe-area-inset-bottom));width:64px;height:64px;border-radius:50%;background:#000;border:2px solid #3a4260;font-size:28px;color:#fff}
#bg{position:fixed;inset:0;background:#000a;display:flex;align-items:flex-end}
#bg[hidden]{display:none}
#sh{background:var(--card);width:100%;border-radius:20px 20px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom))}
#sh h3{margin-bottom:8px}.n{color:#fbbf24;margin-bottom:8px}
.g{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:8px}
.g button{border:0;border-radius:12px;color:#fff;padding:10px 4px;font-size:15px;font-weight:600}
.x{width:100%;background:none;border:1px solid var(--bd);color:var(--tx);border-radius:12px;padding:10px}
#toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%);background:#fff;color:#000;padding:8px 14px;border-radius:20px;font-size:14px;max-width:85%}
#toast[hidden]{display:none}
</style>
</head>
<body>
<header><h1>Davinia</h1></header>
<div class="tabs"><button id="t1" class="on" onclick="tab(1)">Calendario</button><button id="t2" onclick="tab(2)">Gastos</button></div>
<div class="nav"><button onclick="mv(-1)">‹</button><b id="mt"></b><button onclick="mv(1)">›</button></div>

<section id="v1"><div id="cal"></div></section>

<section id="v2" hidden>
  <div class="card"><h3>Gastos fijos (final de mes)</h3><div id="fx"></div><div class="m" id="dv"></div></div>
  <div class="card"><h3>Añadir gasto variable</h3>
    <div class="f">
      <select id="vt"><option>Gasolina</option><option>Otros</option></select>
      <input id="va" type="number" step="0.01" placeholder="Importe €">
      <input id="vd" type="date">
      <input id="vn" placeholder="Nota">
      <button class="b full" onclick="addV()">Guardar gasto</button>
    </div></div>
  <div class="card"><h3>Este mes</h3><div id="vl"></div><div class="tot" id="tm"></div></div>
  <div class="card"><h3>Histórico 2026</h3><div id="hs"></div></div>
  <div class="card"><h3>Copia de seguridad</h3>
    <div class="f"><button class="b" onclick="exp()">Exportar JSON</button>
    <button class="b" onclick="$('#im').click()">Importar JSON</button></div>
    <input id="im" type="file" accept=".json" hidden onchange="imp(this)"></div>
</section>

<button id="mic" onclick="voz()" aria-label="Voz">🎤</button>
<div id="bg" hidden onclick="if(event.target===this)this.hidden=true"><div id="sh"></div></div>
<div id="toast" hidden></div>

<script>
const $=s=>document.querySelector(s);
const K='davinia-v1';
const SH={
 M:['07:00','15:00','#d97706','🌅'],M1:['08:00','16:00','#a16207','🌤️'],M2:['08:30','16:30','#4d7c0f','☀️'],
 R:['09:00','17:00','#0f766e','🔄'],R1:['10:00','18:00','#0e7490','🔁'],R2:['12:00','20:00','#2563eb','🌇'],
 R3:['11:00','19:00','#7c3aed','🕚'],R4:['14:00','22:00','#a21caf','🌆'],T:['15:00','23:00','#4338ca','🌙'],
 Libre:['','','#475569','🏖️'],Vacación:['','','#be123c','✈️']
};
const DEF=()=>({shifts:{},notes:{'2026-11-09':'🦷 Dentista 11:15'},vars:[],
 fixed:[{n:'Alquiler',a:623,e:1,s:'2026-01'},{n:'Sindicato',a:32.55,e:2,s:'2026-10'},{n:'Seguro salud',a:198,e:3,s:'2026-10'}]});
let S;try{S=JSON.parse(localStorage.getItem(K))||DEF()}catch(e){S=DEF()}
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}};
const pad=n=>String(n).padStart(2,'0');
const ds=(y,m,d)=>`${y}-${pad(m+1)}-${pad(d)}`;
const eur=n=>n.toLocaleString('es-ES',{style:'currency',currency:'EUR'});
const now=new Date(),today=ds(now.getFullYear(),now.getMonth(),now.getDate());
let cur=new Date(now.getFullYear(),now.getMonth(),1),view=1;

function tab(n){view=n;$('#v1').hidden=n!=1;$('#v2').hidden=n!=2;$('#t1').className=n==1?'on':'';$('#t2').className=n==2?'on':'';render()}
function mv(d){cur=new Date(cur.getFullYear(),cur.getMonth()+d,1);render()}
function render(){$('#mt').textContent=cur.toLocaleDateString('es-ES',{month:'long',year:'numeric'});view==1?cal():gas()}

function cal(){
 const y=cur.getFullYear(),m=cur.getMonth(),off=(new Date(y,m,1).getDay()+6)%7,n=new Date(y,m+1,0).getDate();
 let h=['L','M','X','J','V','S','D'].map(x=>`<b class="w">${x}</b>`).join('');
 for(let i=0;i<off;i++)h+='<i></i>';
 for(let d=1;d<=n;d++){const k=ds(y,m,d),c=S.shifts[k],s=SH[c];
  h+=`<button class="d${k===today?' t':''}" ${s?`style="background:${s[2]}"`:''} onclick="sheet('${k}')"><span>${d}</span>${s?`<em>${s[3]}</em><small>${c}</small>`:'<em></em><small></small>'}${S.notes[k]?'<u>📌</u>':''}</button>`}
 $('#cal').innerHTML=h}

function sheet(k){
 let h=`<h3>${k.split('-').reverse().join('/')}</h3>`;
 if(S.notes[k])h+=`<p class="n">${S.notes[k]}</p>`;
 h+='<div class="g">'+Object.keys(SH).map(c=>`<button style="background:${SH[c][2]}" onclick="setS('${k}','${c}')">${SH[c][3]} ${c}<br><small>${SH[c][0]?SH[c][0]+'-'+SH[c][1]:''}</small></button>`).join('')+'</div>';
 h+=`<button class="x" onclick="setS('${k}','')">Borrar turno</button>`;
 $('#sh').innerHTML=h;$('#bg').hidden=false}
function setS(k,c){c?S.shifts[k]=c:delete S.shifts[k];save();$('#bg').hidden=true;render()}

function due(f,y,m){const[sy,sm]=f.s.split('-').map(Number);const d=y*12+m-(sy*12+sm-1);return d>=0&&d%f.e===0}
function gas(){
 const y=cur.getFullYear(),m=cur.getMonth(),p=`${y}-${pad(m+1)}`;
 $('#fx').innerHTML=S.fixed.map((f,i)=>`<div class="r"><span>${f.n}<br><span class="m">cada ${f.e} m</span></span>
  <input type="number" step="0.01" value="${f.a}" onchange="S.fixed[${i}].a=+this.value;save();gas()">
  <input type="month" value="${f.s}" onchange="S.fixed[${i}].s=this.value;save();gas()">
  <b>${due(f,y,m)?eur(f.a):'—'}</b></div>`).join('');
 const dv=new Date(y,m+1,0);while(dv.getDay()!==5)dv.setDate(dv.getDate()-1);dv.setDate(dv.getDate()-7);
 $('#dv').textContent=`Devengos: viernes ${dv.getDate()}. Transporte del mes anterior y nocturnidad.`;
 const vs=S.vars.filter(v=>v.d.startsWith(p)).sort((a,b)=>a.d<b.d?1:-1);
 $('#vl').innerHTML=vs.map(v=>`<div class="v"><span>${v.d.slice(8)}/${v.d.slice(5,7)} · ${v.t}${v.n?' · '+v.n:''}</span><span>${eur(v.a)} <button onclick="delV(${v.id})">✕</button></span></div>`).join('')||'<div class="m">Sin gastos variables este mes.</div>';
 const fx=S.fixed.reduce((t,f)=>t+(due(f,y,m)?f.a:0),0),vt=vs.reduce((t,v)=>t+v.a,0);
 $('#tm').textContent='Total '+eur(fx+vt);
 let h='';for(let i=0;i<12;i++){const q=`2026-${pad(i+1)}`;
  const t=S.fixed.reduce((s,f)=>s+(due(f,2026,i)?f.a:0),0)+S.vars.filter(v=>v.d.startsWith(q)).reduce((s,v)=>s+v.a,0);
  h+=`<div class="v"><span style="text-transform:capitalize">${new Date(2026,i,1).toLocaleDateString('es-ES',{month:'long'})}</span><span>${eur(t)}</span></div>`}
 $('#hs').innerHTML=h;
 if(!$('#vd').value)$('#vd').value=today}
function addV(){const a=parseFloat($('#va').value);if(!a)return toast('Pon un importe');
 S.vars.push({id:Date.now(),t:$('#vt').value,a,d:$('#vd').value||today,n:$('#vn').value});
 $('#va').value='';$('#vn').value='';save();gas()}
function delV(id){S.vars=S.vars.filter(v=>v.id!==id);save();gas()}

function exp(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S)],{type:'application/json'}));a.download='davinia-backup.json';a.click()}
function imp(el){const f=el.files[0];if(!f)return;const r=new FileReader();
 r.onload=()=>{try{S=JSON.parse(r.result);save();render();toast('Copia importada')}catch(e){toast('Archivo no válido')}};r.readAsText(f)}

function toast(t){const e=$('#toast');e.textContent=t;e.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>e.hidden=true,3500)}
function voz(){
 const R=window.SpeechRecognition||window.webkitSpeechRecognition;if(!R)return toast('Voz no disponible en este navegador');
 const r=new R();r.lang='es-ES';r.onresult=e=>cmd(e.results[0][0].transcript);r.onerror=()=>toast('No te he oído');r.start();toast('Escuchando…')}
function cmd(t){
 const l=t.toLowerCase().replace(',','.');let m;const dm=l.match(/d[ií]a (\d{1,2})/);
 const day=dm?+dm[1]:(cur.getMonth()===now.getMonth()&&cur.getFullYear()===now.getFullYear()?now.getDate():1);
 const k=ds(cur.getFullYear(),cur.getMonth(),day);
 if(m=l.match(/(gasolina|otros).*?(\d+(?:\.\d+)?)/)){
  S.vars.push({id:Date.now(),t:m[1]==='gasolina'?'Gasolina':'Otros',a:+m[2],d:k,n:'voz'});save();toast(`${m[1]} ${m[2]} €`);render()}
 else if(dm&&(m=l.match(/\b(m1|m2|r1|r2|r3|r4|m|r|t|libre|vacaci[oó]n)\b/))){
  const c=m[1].startsWith('vac')?'Vacación':m[1]==='libre'?'Libre':m[1].toUpperCase();
  S.shifts[k]=c;save();toast(`Día ${day}: ${c}`);render()}
 else toast('No entendido: '+t)}
render();
</script>
</body>
</html>
