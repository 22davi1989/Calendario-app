<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0b0f19">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">

<title>Davinia</title>
<style>
:root{--bg:#0b0f19;--card:#151b2b;--line:#232b40;--tx:#eef1f8;--mu:#8a93a8;--ac:#6ea8ff;--pk:#ff3db8;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:var(--bg);color:var(--tx);font:15px system-ui,-apple-system,Segoe UI,Roboto,sans-serif;overflow-x:hidden}
#app{height:100%;display:flex;flex-direction:column;max-width:520px;margin:0 auto}
header{padding:8px 12px 6px}
.nav{display:flex;align-items:center;justify-content:space-between}
.nav button{width:46px;height:46px;border-radius:14px;border:0;background:var(--card);color:var(--tx);font-size:24px}
.ttl{font-size:20px;font-weight:800}
.tot{margin-top:6px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 12px;display:flex;justify-content:space-between;color:var(--mu);font-size:13px}
.tot b{color:var(--tx);font-size:16px}
main{flex:1;overflow-y:auto;padding:6px 0 160px}
.wd,.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;padding:0 3px}
.wd div{text-align:center;color:var(--mu);font-size:11px;padding:4px 0}
.c{aspect-ratio:1/1.7;background:var(--card);border:1.5px solid transparent;border-radius:9px;color:var(--tx);display:flex;flex-direction:column;align-items:center;padding:3px 0;font:inherit;min-width:0;overflow:hidden;position:relative}
.c.e{background:transparent}
.c .n{font-size:13px;color:var(--mu);line-height:1.3;margin-top:2px}
.c.t .n{color:#fff;background:var(--ac);border-radius:8px;padding:0 6px}
.c .s{font-weight:800;font-size:18px;margin-top:6px}
.c .h{font-size:8px;color:var(--mu);letter-spacing:-.2px;white-space:nowrap}
.c .s.L{font-size:8.5px;letter-spacing:-.4px}
.c .hr{position:absolute;bottom:2px;font-size:9px;font-style:normal}
.c.p{border:2px solid #facc15;box-shadow:inset 0 0 10px #facc1555}
.c .ev{position:absolute;top:3px;right:3px;width:6px;height:6px;border-radius:50%;background:#38bdf8}
.c .ev.d{background:#4b5675}
.leg{padding:10px 12px;color:var(--mu);font-size:12px;display:flex;gap:14px;flex-wrap:wrap}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;margin:8px 10px;padding:12px}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 0;border-bottom:1px solid var(--line)}
.row:last-child{border:0}
.row small{color:var(--mu);display:block}
.amt{font-weight:700;white-space:nowrap}
h3{margin:0 0 8px;font-size:15px}
input,select,textarea{width:100%;background:#0f1422;color:var(--tx);border:1px solid var(--line);border-radius:12px;padding:13px;font:inherit;margin-bottom:8px}
textarea{min-height:110px;font:12px monospace}
.btn{width:100%;min-height:48px;border:0;border-radius:12px;background:var(--ac);color:#06101f;font-weight:800;font-size:15px;margin-bottom:8px}
.btn.g{background:#232b40;color:var(--tx)}
.x{border:0;background:#2a1a22;color:#ff7a90;border-radius:10px;min-width:40px;height:40px;font-size:16px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tabs{position:fixed;left:0;right:0;bottom:0;max-width:520px;margin:auto;display:grid;grid-template-columns:repeat(3,1fr);background:#0d1220;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:10}
.tabs button{background:none;border:0;color:var(--mu);padding:9px 0 10px;font:inherit;font-size:11px;display:flex;flex-direction:column;align-items:center;gap:2px;min-height:58px}
.tabs button span{font-size:21px}
.tabs button.on{color:var(--ac)}
.fab{position:fixed;right:max(16px,calc(50% - 244px));bottom:calc(76px + env(safe-area-inset-bottom,0px));width:64px;height:64px;border-radius:50%;border:2px solid #4b5675;background:#000;color:#fff;font-size:28px;box-shadow:0 6px 20px #000;z-index:15}
.fab2{position:fixed;right:calc(max(16px,calc(50% - 244px)) + 76px);bottom:calc(82px + env(safe-area-inset-bottom,0px));width:52px;height:52px;border-radius:50%;border:2px solid #4b5675;background:#1d2640;color:#fff;font-size:30px;line-height:1;z-index:15}
.bd{position:fixed;inset:0;background:#000b;z-index:20}
.sh{position:fixed;left:0;right:0;bottom:0;max-width:520px;margin:auto;background:#121826;border-radius:22px 22px 0 0;padding:14px 14px calc(16px + env(safe-area-inset-bottom,0px));max-height:86%;overflow:auto;z-index:21;animation:up .2s ease-out}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
.grip{width:44px;height:5px;border-radius:3px;background:#2d3650;margin:0 auto 10px}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:0 10px;margin-top:8px}
.tile{border-radius:12px;padding:10px 9px;color:#0b0f19;min-width:0}
.tile small{display:block;font-size:11px;font-weight:700;opacity:.8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile b{font-size:15px;white-space:nowrap}
.pills{display:flex;gap:8px;padding:10px 10px 0;overflow-x:auto}
.pill{flex:none;background:var(--card);color:var(--tx);border:1px solid var(--line);border-radius:24px;padding:13px 18px;font:inherit;font-weight:700}
.ic{width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:19px;flex:none}
.dn{display:flex;align-items:center;justify-content:space-around;gap:6px}
.hb{display:flex;align-items:center;gap:8px;padding:7px 0;font-size:12px}
.hb span{width:30px;color:var(--mu);text-transform:capitalize}
.hb.on span{color:var(--ac);font-weight:800}
.hb i{height:10px;border-radius:5px;background:var(--ac);flex:none;min-width:2px}
.hb b{margin-left:auto}
.lg div{display:flex;align-items:center;gap:6px;font-size:12px;margin:6px 0;color:var(--mu)}
.lg i{width:10px;height:10px;border-radius:50%;display:inline-block}
.chips{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}
.chip{border:2px solid;border-radius:12px;background:#0f1422;padding:8px 2px;min-height:56px;font:inherit;color:var(--tx)}
.chip b{display:block;font-size:15px;white-space:nowrap}
.chip small{font-size:10px;color:var(--mu)}
.chip.on{background:#ffffff18}
.toast{position:fixed;left:12px;right:12px;bottom:calc(150px + env(safe-area-inset-bottom,0px));max-width:496px;margin:auto;background:#1d2640;border:1px solid var(--ac);border-radius:14px;padding:12px 14px;z-index:30;font-size:14px}
</style></head><body>
<div id="app"></div>
<script>
const VER='17/11 01:18';let PERSIST=null;
try{if(navigator.storage&&navigator.storage.persist){navigator.storage.persisted().then(v=>{PERSIST=v;if(!v)return navigator.storage.persist().then(r=>{PERSIST=r})}).catch(()=>{})}}catch(e){}
if('serviceWorker' in navigator){const had=!!navigator.serviceWorker.controller;navigator.serviceWorker.addEventListener('controllerchange',()=>{if(had&&!window.__rl){window.__rl=1;location.reload()}});window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').then(r=>r.update()).catch(()=>{}))}
const SH={M:['07:00','15:00','#ff9800','🥱'],M1:['08:00','16:00','#aed581','😮‍💨'],M2:['08:30','16:30','#26c6da','😩'],R:['09:00','17:00','#ff5f6d','🏵️'],R1:['10:00','18:00','#ba68c8','💮'],R2:['12:00','20:00','#2ee66b','🌺'],R3:['11:00','19:00','#ff6ee0','🌼'],R4:['14:00','22:00','#6f9bff','🌃'],T:['15:00','23:00','#b39b94','🌌'],Libre:['','','#ff8a65','🎊'],Vacaciones:['','','#9575cd','🏖️']};
const MN=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const pad=n=>String(n).padStart(2,'0'),key=(y,m,d)=>`${y}-${pad(m+1)}-${pad(d)}`,cap=s=>s[0].toUpperCase()+s.slice(1);
const eur=n=>n.toLocaleString('es-ES',{minimumFractionDigits:2,maximumFractionDigits:2})+' €';
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let S={shifts:{},partner:{},events:[],exp:[],set:{u:0,s:0}};
try{const r=localStorage.getItem('turnos_v1');if(r)S=Object.assign(S,JSON.parse(r))}catch(e){}
const save=()=>{try{localStorage.setItem('turnos_v1',JSON.stringify(S))}catch(e){}};save();
if(!S.dent2){S.events.forEach(e=>{if(e.date==='2026-11-09'&&/dentista/i.test(e.title))e.done=true});S.dent2=true;save()}
if(!S.fix1){const bad=/^(crea|crear|a[ñn]ade|a[ñn]adir|elimina|eliminar|borra|borrar|quita|quitar)\b/i,rm=S.events.filter(e=>bad.test(e.title));if(rm.length){S.events=S.events.filter(e=>!bad.test(e.title));if(rm.some(e=>/dentista/i.test(e.title))&&!S.events.some(e=>e.date==='2026-11-16'&&/dentista/i.test(e.title)))S.events.push({id:'fix16',date:'2026-11-16',time:'',title:'Dentista'})}S.fix1=true;save()}
if(!S.pr2){S.partner=S.partner||{};if(!Object.keys(S.partner).length){const pr=(m,a,b)=>{for(let d=a;d<=b;d++)S.partner[key(2026,m,d)]=true};pr(9,26,31);pr(10,1,8);pr(10,10,11);pr(10,17,17);pr(10,22,22);pr(10,28,29);pr(11,5,6)}S.pr2=true;save()}
const now=new Date(),todayK=key(now.getFullYear(),now.getMonth(),now.getDate());
let U={tab:'cal',y:now.getFullYear(),m:now.getMonth(),sel:null,toast:'',bk:''};
let tt;const toast=(t,ms=4000)=>{U.toast=t;render();clearTimeout(tt);tt=setTimeout(()=>{U.toast='';render()},ms)};

const REC0=[{c:'Alquiler',a:325,e:1,s:0,d:0},{c:'Sindicato',a:32.55,e:3,s:0,d:1},{c:'Seguro de salud',a:198.3,e:3,s:0,d:1},{c:'Agua',a:6,e:2,s:1,d:27},{c:'Basura',a:8,e:2,s:1,d:27},{c:'Teléfono',a:37.93,e:1,s:0,d:13},{c:'Seguro coche',a:299.1,e:12,s:7,d:28}];
const rec=()=>{if(!S.rec)S.rec=JSON.parse(JSON.stringify(REC0));if(!S.r325){S.rec.forEach(r=>{if(r.c==='Alquiler')r.a=325});S.r325=true}if(!S.rec.some(r=>r.c==='Luz'))S.rec.push({c:'Luz',a:16,e:1,s:0,d:28});if(!S.luz2){S.rec.forEach(r=>{if(r.c==='Luz'){r.a=32.15;r.d=15}});S.luz2=true}if(!S.luz3){S.rec.forEach(r=>{if(r.c==='Luz')r.v=1});S.luz3=true}return S.rec};
function fixed(y,m){if(y*12+m<2026*12)return [];const last=new Date(y,m+1,0).getDate(),pre=`${y}-${pad(m+1)}-01`,nx=`${y}-${pad(m+1)}-31`;
 return rec().filter(r=>(((m-r.s)%r.e)+r.e)%r.e===0&&!S.exp.some(e=>e.cat===r.c&&e.date>=pre&&e.date<=nx)).map((r,i)=>({id:'f'+i,date:key(y,m,Math.min(r.d||last,last)),amount:r.a,cat:r.c,fixed:1,v:r.v,note:r.v?'importe variable':''}))}
function recCard(){return `<div class="card"><h3>Pagos fijos automáticos</h3><small style="color:var(--mu)">Importe y mes del primer cobro. Si ya hay un gasto real de esa categoría, no se duplica.</small>`+rec().map((r,i)=>`<div class="row"><div style="flex:1;min-width:0">${CI[r.c]||''} ${r.c}<small>${r.v?'Cada mes · variable (orientativo)':r.e===1?'Cada mes':r.e===12?'Una vez al año':'Cada '+r.e+' meses'}</small></div><input data-a="ra" data-i="${i}" type="number" inputmode="decimal" step="0.01" value="${r.a}" style="width:92px;margin:0">${r.e===1?'':`<select data-a="rs" data-i="${i}" style="width:78px;margin:0">${MN.map((n,j)=>`<option value="${j}"${j===r.s?' selected':''}>${cap(n).slice(0,3)}</option>`).join('')}</select>`}</div>`).join('')+'</div>'}
function fixedOld(y,m){if(y*12+m<2026*12+10)return [];const d=key(y,m,new Date(y,m+1,0).getDate()),l=[{id:'f1',date:d,amount:623,cat:'Alquiler',fixed:1}];
 if(((m-S.set.u)%2+2)%2===0)l.push({id:'f2',date:d,amount:32.55,cat:'Sindicato',fixed:1});
 if(((m-S.set.s)%3+3)%3===0)l.push({id:'f3',date:d,amount:198,cat:'Seguro de salud',fixed:1});return l}
const monthExp=(y,m)=>fixed(y,m).concat(S.exp.filter(e=>e.date.startsWith(`${y}-${pad(m+1)}`))).sort((a,b)=>a.date<b.date?-1:1);

function cal(){const f=(new Date(U.y,U.m,1).getDay()+6)%7,n=new Date(U.y,U.m+1,0).getDate();
 let h=remBanner()+remNext()+evBanner()+'<div class="wd">'+'LMXJVSD'.split('').map(d=>`<div>${d}</div>`).join('')+'</div><div class="grid">';
 for(let i=0;i<f;i++)h+='<div class="c e"></div>';
 for(let d=1;d<=n;d++){const k=key(U.y,U.m,d),s=S.shifts[k],p=S.partner[k],ev=S.events.some(e=>e.date===k)||!!remText(k),evp=S.events.some(e=>e.date===k&&!e.done)||(!!remText(k)&&!(S.remDone&&S.remDone[k]));
  h+=`<button class="c${p?' p':''}${k===todayK?' t':''}" data-a="day" data-v="${k}"><span class="n">${d}</span>${s&&SH[s]?`<span class="s${SH[s][0]?'':' L'}" style="color:${SH[s][2]}">${s}</span>${SH[s][0]?`<span class="h">${SH[s][0]}-${SH[s][1]}</span>`:`<span class="h" style="font-size:11px">${SH[s][3]}</span>`}`:''}${ev?`<i class="ev${evp?'':' d'}"></i>`:''}${p?'<i class="hr">❤</i>':''}</button>`}
 return h+'</div>'}

function sheet(){const k=U.sel,[y,m,d]=k.split('-').map(Number),dt=new Date(y,m-1,d),cur=S.shifts[k];
 const lbl=cap(dt.toLocaleDateString('es-ES',{weekday:'long',day:'numeric',month:'long'}));
 let h=`<div class="bd" data-a="close"></div><div class="sh"><div class="grip"></div><h3>${lbl}</h3><div class="chips">`;
 for(const c in SH)h+=`<button class="chip${cur===c?' on':''}" style="border-color:${SH[c][2]}" data-a="shift" data-v="${c}"><b style="color:${SH[c][2]}">${SH[c][3]} ${c}</b><small>${SH[c][0]?SH[c][0]+'-'+SH[c][1]:'&nbsp;'}</small></button>`;
 h+=`</div><div class="two"><button class="btn g" data-a="shift" data-v="">Sin turno</button><button class="btn" style="background:${S.partner[k]?'#facc15':'#232b40'};color:${S.partner[k]?'#1a1400':'#fff'}" data-a="partner">${S.partner[k]?'✓ Rayco libre':'Rayco libre'}</button></div>${(S.events.some(e=>e.date===k)||remText(k))?'<h3>Agenda</h3>':''}`;
 S.events.filter(e=>e.date===k).sort((a,b)=>a.time<b.time?-1:1).forEach(e=>{h+=agendaRow(e.id,e.done,esc(e.time||'--:--'),esc(e.title))});
 if(remText(k))h+=agendaRow('rem',S.remDone&&S.remDone[k],'🔔',esc(remText(k)));h+=`<h3 style="margin-top:14px">Nueva cita</h3><div class="two"><input id="et" type="time"><input id="en" placeholder="Ej.: Dentista"></div><button class="btn" data-a="addev">Añadir cita</button></div>`;return h}

const CC={Alquiler:'#6ea8ff',Sindicato:'#ff9800','Seguro de salud':'#2ee66b',Gasolina:'#ff5f6d',Otros:'#ba68c8'},CI={Alquiler:'🏠',Sindicato:'🤝','Seguro de salud':'🩺',Gasolina:'⛽',Otros:'🧾'};
Object.assign(CC,{Agua:'#38bdf8',Basura:'#94a3b8',Luz:'#fcd34d'});Object.assign(CI,{Agua:'💧',Basura:'🗑️',Luz:'💡'});Object.assign(CC,{Recargas:'#2dd4bf',Bizum:'#f472b6','Teléfono':'#a3e635',Hogar:'#38bdf8','Seguro coche':'#818cf8'});Object.assign(CI,{Recargas:'💳',Bizum:'📲','Teléfono':'📱',Hogar:'💧','Seguro coche':'🚗'});
function histCard(){const mt=[...Array(12)].map((_,i)=>monthExp(U.y,i).reduce((a,e)=>a+e.amount,0)),mx=Math.max(...mt,1);
 const rows=mt.map((v,i)=>v&&(U.y<now.getFullYear()||i<=now.getMonth())?`<div class="hb${i===U.m?' on':''}" data-a="gm" data-v="${i}"><span>${MN[i].slice(0,3)}</span><i style="width:${v/mx*52}%"></i><b>${eur(v)}</b></div>`:'').join('');
 return rows?`<div class="card"><h3>Histórico ${U.y}</h3>${rows}</div>`:''}
function remDate(y,m){let d=new Date(y,m+1,0).getDate();while(new Date(y,m,d).getDay()!==5)d--;return d-7}
const REM0='Devengos: poner transporte y nocturnidad de {mes}';
function remText(k){const[y,m,d]=k.split('-').map(Number);if(y*12+m-1<2026*12+10||d!==remDate(y,m-1)||(S.remDel&&S.remDel[k]))return '';return (S.remOv&&S.remOv[k])||(S.remTpl||REM0).split('{mes}').join(MN[(m+10)%12])}
function impTurnos(txt){const map={vac:'Vacaciones'},ok=[],bad=[];for(const c in SH)map[norm(c).toLowerCase()]=c;
 txt.split(/[\n;]+/).forEach(l=>{l=l.trim();if(!l)return;const m=l.match(/^(\d{4}-\d{1,2}-\d{1,2}|\d{1,2}[\/.-]\d{1,2}(?:[\/.-]\d{2,4})?)\s*[:=,\s]\s*(.+)$/);if(!m)return bad.push(l);const p=m[1].split(/[\/.-]/).map(Number);let y,mo,d;if(/^\d{4}-/.test(m[1])){[y,mo,d]=p}else{d=p[0];mo=p[1];y=p[2]?(p[2]<100?2000+p[2]:p[2]):new Date().getFullYear()}
  const dt=new Date(y,mo-1,d);if(dt.getMonth()!==mo-1)return bad.push(l);const v=norm(m[2].trim().toLowerCase()).replace(/\s+/g,''),c=map[v]||(/^(-|borrar|nada|quitar)$/.test(v)?'':null);if(c===null)return bad.push(l);const k=key(y,mo-1,d);if(c)S.shifts[k]=c;else delete S.shifts[k];ok.push(k)});
 save();return{n:ok.length,bad}}
function turnosCard(){return `<div class="card"><h3>Importar turnos</h3><small style="color:var(--mu)">Mándame en el chat la foto o captura de tus turnos y te devolveré un texto para pegar aquí. Una línea por día, por ejemplo: 2026-12-01 M</small><textarea id="ti" placeholder="2026-12-01 M&#10;2026-12-02 R1&#10;2026-12-03 Libre" style="margin-top:10px"></textarea><button class="btn" data-a="timp">Añadir al calendario</button></div>`}
function remCard(){return `<div class="card"><h3>Recordatorio de devengos</h3><small style="color:var(--mu)">Sale el viernes anterior al último viernes de cada mes. {mes} se cambia por el mes anterior. Para cambiar solo uno, tócalo en el calendario y pulsa ✎.</small><input data-a="rt" value="${esc(S.remTpl||REM0)}" style="margin-top:10px">${S.remDel&&Object.keys(S.remDel).length?'<button class="btn g" style="margin-top:8px" data-a="remrestore">Restaurar recordatorios eliminados</button>':''}</div>`}
function agendaRow(id,done,pre,txt){

  save();return toast('Cita cambiada: '+esc(e.title)+' · '+ch.join(', ')+' ✓'),true}
 const title=mkTitle(t);S.events.push({id:Date.now()+'',date:pd.k,time:pt.tm,title});save();
 return toast('Cita añadida: '+esc(title)+' · '+fdate(pd.k)+(pt.tm?' '+pt.tm:'')+' ✓'+hit),true}
function parseDate(t){return pdate(t,false).k}
function parseDateOld(t){const d=new Date();let m;
 if(/pasado ma[ñn]ana/.test(t))d.setDate(d.getDate()+2);
 else if(/ma[ñn]ana/.test(t))d.setDate(d.getDate()+1);
 else if(m=t.match(/\b(?:d[ií]a|el)\s+(\d{1,2})(?:\s+de\s+([a-zé]+))?/)){const mi=m[2]?MN.indexOf(m[2]):-1;d.setDate(1);if(mi>=0)d.setMonth(mi);d.setDate(+m[1])}
 return key(d.getFullYear(),d.getMonth(),d.getDate())}
function handle(raw){if(cmdAgenda(raw))return;handleOld(raw)}
function handleOld(raw){const t=raw.toLowerCase().replace(/,/g,'.'),k=parseDate(t);let m;
 const hit=`<br><small style="color:var(--mu)">“${esc(raw)}”</small>`;
 if(m=t.match(/turno\s+(m|r|t)\s*([1-4])?\b/)){const c=(m[1]+(m[2]||'')).toUpperCase();if(SH[c]){S.shifts[k]=c;save();return toast(`Turno ${c} el ${k.split('-').reverse().join('/')} ✓`+hit)}}
 if(/pareja|rayco/.test(t)&&/libre/.test(t)){S.partner[k]=true;save();return toast('Rayco libre el '+k.split('-').reverse().join('/')+' ✓'+hit)}
 if(/vacaci/.test(t)){S.shifts[k]='Vacaciones';save();return toast('Vacaciones el '+k.split('-').reverse().join('/')+' ✓'+hit)}
 if(/\blibre\b/.test(t)&&!/pareja|rayco/.test(t)){S.shifts[k]='Libre';save();return toast('Libre el '+k.split('-').reverse().join('/')+' ✓'+hit)}
 if(/\b(cita|reuni[oó]n|evento|m[eé]dico|dentista)\b/.test(t)){const tm=t.match(/a las\s+(\d{1,2})(?:[:.](\d{2}))?/);
  let title=t.replace(/a las\s+\d{1,2}([:.]\d{2})?/,'').replace(/\b(el )?d[ií]a \d{1,2}( de [a-zé]+)?/,'').replace(/\b(hoy|pasado ma[ñn]ana|ma[ñn]ana)\b/g,'').replace(/\s+/g,' ').trim();
  S.events.push({id:Date.now()+'',date:k,time:tm?pad(+tm[1])+':'+(tm[2]||'00'):'',title:cap(title||'Cita')});save();return toast('Cita añadida ✓'+hit)}
 const a=t.match(/(\d+(?:\.\d{1,2})?)\s*(?:€|euros?)/)||(/gasolina/.test(t)&&t.match(/(\d+(?:\.\d{1,2})?)/));
 if(a){const g=/gasolina|repost/.test(t);S.exp.push({id:Date.now()+'',date:k,amount:parseFloat(a[1]),cat:g?'Gasolina':'Otros',note:g?'':t.replace(a[0],'').replace(/\b(hoy|ma[ñn]ana)\b/,'').trim()});save();return toast(`${g?'Gasolina':'Gasto'} ${eur(parseFloat(a[1]))} ✓`+hit)}
 toast('No lo he entendido.'+hit+'<br><small>Prueba: “Gasolina 40 euros hoy”, “Turno M mañana”, “Crea una cita el lunes a las 11 para el dentista”, “Elimina la cita del dentista”.</small>',7000)}
async function mic(){const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
 if(!SR){U.vs='nosr';render();return}
 try{if(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia){const st=await navigator.mediaDevices.getUserMedia({audio:true});st.getTracks().forEach(t=>t.stop())}}catch(e){U.vs='perm';render();return}
 try{const r=new SR();r.lang='es-ES';r.interimResults=false;r.maxAlternatives=1;toast('🎙 Escuchando… habla ahora',9000);
  r.onresult=e=>{clearTimeout(tt);U.toast='';handle(e.results[0][0].transcript)};
  r.onerror=e=>{clearTimeout(tt);U.toast='';U.vs='err:'+e.error;render()};
  r.onend=()=>{if(U.toast&&U.toast.indexOf('Escuchando')>=0){clearTimeout(tt);U.toast='';render()}};
  r.start()}catch(e){U.vs='err:start';render()}}
function micOld(){const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
 if(!SR){U.vs=1;render();return}
 try{const r=new SR();r.lang='es-ES';r.interimResults=false;toast('🎙 Escuchando…',9000);
  r.onresult=e=>handle(e.results[0][0].transcript);
  r.onerror=e=>{if(e.error==='not-allowed'||e.error==='service-not-allowed'){clearTimeout(tt);U.toast='';U.vs=1;render();return}toast('Error de voz: '+e.error,5000)};
  r.start()}catch(e){toast('No se pudo iniciar el micrófono.')}}

// ---- eventos ----
const val=id=>document.getElementById(id).value;
let tx0=0,ty0=0,tOk=false;
document.addEventListener('touchstart',e=>{const t=e.touches[0];tx0=t.clientX;ty0=t.clientY;tOk=!U.sel&&!U.xs&&!U.vs&&!U.qc&&U.tab!=='aj'&&!/INPUT|TEXTAREA|SELECT/.test(e.target.tagName||'')},{passive:true});
document.addEventListener('touchend',e=>{if(!tOk)return;const t=e.changedTouches[0],dx=t.clientX-tx0,dy=t.clientY-ty0;if(Math.abs(dx)<60||Math.abs(dx)<Math.abs(dy)*1.5)return;U.m+=dx<0?1:-1;if(U.m<0){U.m=11;U.y--}if(U.m>11){U.m=0;U.y++}render()},{passive:true});
document.addEventListener('change',e=>{const a=e.target.dataset.a;if(a==='rf'){const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const o=JSON.parse(r.result);if(!o.shifts||!o.exp)throw 0;S=Object.assign({shifts:{},partner:{},events:[],exp:[],set:{u:0,s:0}},o);save();toast('Copia importada ✓')}catch(x){toast('Archivo no válido')}};r.readAsText(f);return}if(a==='rt'){S.remTpl=e.target.value.trim()||REM0;save();return}if(a==='ra'){rec()[+e.target.dataset.i].a=parseFloat(e.target.value)||0;save();return}if(a==='rs'){rec()[+e.target.dataset.i].s=+e.target.value;save();return}if(a==='cu'){S.set.u=+e.target.value;save();render()}if(a==='cs'){S.set.s=+e.target.value;save();render()}});
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b||b.tagName==='SELECT'||b.tagName==='INPUT')return;const a=b.dataset.a,v=b.dataset.v;
 if(a==='prev'||a==='next'){U.m+=a==='next'?1:-1;if(U.m<0){U.m=11;U.y--}if(U.m>11){U.m=0;U.y++}}
 else if(a==='tab')U.tab=v;
 else if(a==='day'){U.sel=v;U.ed=0}
 else if(a==='close'){U.sel=null;U.ed=0}
 else if(a==='shift'){v?S.shifts[U.sel]=v:delete S.shifts[U.sel];save();U.sel=null;U.ed=0}
 else if(a==='partner'){S.partner[U.sel]?delete S.partner[U.sel]:S.partner[U.sel]=true;save();U.sel=null;U.ed=0}
 else if(a==='addev'){const n=val('en').trim();if(!n)return;S.events.push({id:Date.now()+'',date:U.sel,time:val('et'),title:n});save();U.sel=null;toast('Cita añadida ✓',2500)}
 else if(a==='delev'){S.events=S.events.filter(x=>x.id!==v);save();U.sel=null;U.ed=0}
 else if(a==='done'){if(v==='rem'){S.remDone=S.remDone||{};if(S.remDone[U.sel])delete S.remDone[U.sel];else S.remDone[U.sel]=true}else{const e=S.events.find(x=>x.id===v);if(e)e.done=!e.done}save();U.sel=null;U.ed=0}
 else if(a==='delrem'){S.remDel=S.remDel||{};S.remDel[U.sel]=true;U.ed=0;save();U.sel=null}
 else if(a==='remrestore'){S.remDel={};save()}
 else if(a==='rdone'){S.remDone=S.remDone||{};if(S.remDone[v])delete S.remDone[v];else S.remDone[v]=true;save()}
 else if(a==='edit')U.ed=v;
 else if(a==='edcancel'){U.ed=0;U.sel=null}
 else if(a==='edsave'){if(v==='rem'){const t=val('ed-x').trim();S.remOv=S.remOv||{};if(t)S.remOv[U.sel]=t;else delete S.remOv[U.sel]}else{const e=S.events.find(x=>x.id===v);if(e){e.title=val('ed-x').trim()||e.title;e.time=val('ed-t')||''}}U.ed=0;save();U.sel=null;toast('Cambios guardados ✓',2500)}
 else if(a==='addexp'){const n=parseFloat(val('ga').replace(',','.'));if(!(n>0))return;S.exp.push({id:Date.now()+'',date:val('gd')||todayK,amount:n,cat:val('gc'),note:val('gn').trim()});save();U.xs=0}
 else if(a==='delexp'){S.exp=S.exp.filter(x=>x.id!==v);save()}
 else if(a==='vclose')U.vs=0;
 else if(a==='vsend'){const t=val('vt').trim();U.vs=0;if(t){render();return handle(t)}}
 else if(a==='timp'){const r=impTurnos(val('ti'));toast(r.n+' días añadidos al calendario ✓'+(r.bad.length?'<br><small>No entendí '+r.bad.length+' línea(s): '+esc(r.bad.slice(0,2).join(' | '))+'</small>':''),7000);return}
 else if(a==='qopen')U.qc=1;
 else if(a==='qclose')U.qc=0;
 else if(a==='qadd'){const n=val('qt').trim();if(!n)return;const dd=val('qd')||todayK;S.events.push({id:Date.now()+'',date:dd,time:val('qh'),title:cap(n)});save();U.qc=0;const p=dd.split('-');U.y=+p[0];U.m=+p[1]-1;toast('Cita añadida ✓ '+fdate(dd),2500)}
 else if(a==='today'){U.y=now.getFullYear();U.m=now.getMonth()}
 else if(a==='gm')U.m=+v;
 else if(a==='xopen')U.xs=v||'Gasolina';
 else if(a==='xclose')U.xs=0;
 else if(a==='dl'){const b=new Blob([JSON.stringify(S)],{type:'application/json'}),u=URL.createObjectURL(b),l=document.createElement('a');l.href=u;l.download='davinia-copia-'+todayK+'.json';document.body.appendChild(l);l.click();l.remove();setTimeout(()=>URL.revokeObjectURL(u),3000);toast('Copia descargada ✓');return}
 else if(a==='mic')return mic();
 else if(a==='exp'){U.bk=JSON.stringify(S);render();const t=document.getElementById('bk');t.select();try{navigator.clipboard.writeText(U.bk).then(()=>toast('Copia copiada al portapapeles ✓'),()=>toast('Selecciona el texto y cópialo'))}catch(x){toast('Selecciona el texto y cópialo')}return}
 else if(a==='imp'){try{const o=JSON.parse(val('bk'));if(!o.shifts||!o.exp)throw 0;S=Object.assign({shifts:{},partner:{},events:[],exp:[],set:{u:0,s:0},seeded:true,mig1:true,hist1:true,hist2:true,hist3:true,hist4:true,hist5:true,hist6:true,hist7:true,hist8:true,hist9:true},o);save();U.bk='';toast('Copia importada ✓');return}catch(x){return toast('JSON no válido')}}
 else if(a==='reset'){if(confirm('¿Borrar todos los datos?')){S={shifts:{},partner:{},events:[],exp:[],set:{u:9,s:9},seeded:true,mig1:true,hist1:true,hist2:true,hist3:true,hist4:true,hist5:true,hist6:true,hist7:true,hist8:true,hist9:true};save()}}
 render()});
